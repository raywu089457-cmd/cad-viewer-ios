name: checks

# This workflow is deliberately narrow, because saying more would be a lie.
#
# SwiftDXF — the DXF parser everything here depends on — does not build on Linux: its
# CodePage decodes through CoreFoundation's CFStringEncoding, guarded by
# `canImport(CoreFoundation)`, which is true on Linux where those symbols do not exist.
# Upstream only tests on macOS, and CI here confirmed the same failure.
#
# So the geometry cannot be tested on a Linux runner, and a macOS runner is 10x the minutes
# on a free account and often unavailable. Rather than publish a permanently red or
# permanently skipped badge, this workflow checks the parts that need no Swift at all, and
# leaves the Swift checks to a machine that can run them:
#
#   ./verification/parse-check.sh                  # syntax, no Apple SDK needed
#   cd verification/dxf-geometry-harness && ./run.sh verify   # the 110 checks, on macOS
#   cd ios/DXFGeometry && swift test                          # on macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  layout:
    name: Repository layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every path the packages and docs promise has to exist, or a fresh clone breaks in a
      # way nobody notices until they try to build it.
      - name: Verify the tree matches its manifests
        run: node .github/verify-layout.mjs

  web-viewer:
    name: DWG viewer bundle builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # This is the one half of the project that builds without an Apple SDK, and it is
      # worth guarding: the app ships its output, and a broken bundle means a blank DWG tab.
      - name: Build
        working-directory: ios/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check the bundle has what the app fetches
        working-directory: ios/web
        run: |
          for file in index.html \
                      assets/libredwg-parser-worker.js \
                      assets/libredwg-web.wasm \
                      assets/mtext-renderer-worker.js; do
            if [ ! -f "dist/$file" ]; then
              echo "missing from the bundle: $file"
              exit 1
            fi
          done
          echo "bundle complete"
