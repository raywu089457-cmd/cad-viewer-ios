name: checks

# What runs where, and why:
#
# - `app` builds the actual app for the simulator on macOS. This is the only real proof that
#   the SwiftUI, WebKit and PDFKit layer type-checks: `swiftc -parse` catches syntax but not
#   types, and three genuine compile errors were found by reading that layer against the
#   SDKs because nothing had ever compiled it. macOS runners are free for public
#   repositories, which is what makes this possible.
# - `geometry` runs the package tests. It has to be macOS too: SwiftDXF decodes code pages
#   through CoreFoundation's CFStringEncoding behind `canImport(CoreFoundation)`, which is
#   true on Linux where those symbols do not exist.
# - `web-viewer` builds the DWG bundle on Linux. It is the one half that needs no Apple SDK.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: App builds and packages test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The DWG bundle is generated, not committed: 17 MB of build output. SwiftPM needs the
      # resource folder to exist before it builds the package.
      - name: Build the DWG viewer bundle
        working-directory: ios/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          DEST=../CADViewer/Sources/CADViewer/Resources/dwgviewer
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R dist/. "$DEST"

      - name: Test DXFGeometry
        working-directory: ios/DXFGeometry
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        working-directory: ios
        run: xcodegen generate

      # The one step that proves the SwiftUI/WebKit/PDFKit layer compiles.
      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project CADViewer.xcodeproj \
            -scheme CADViewer \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  web-viewer:
    name: DWG bundle builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        working-directory: ios/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # The app fetches these four by URL at runtime, so a bundle missing one produces a
      # blank DWG tab rather than a build error.
      - name: Check the bundle has what the app fetches
        working-directory: ios/web
        run: |
          for file in index.html \
                      assets/libredwg-parser-worker.js \
                      assets/libredwg-web.wasm \
                      assets/mtext-renderer-worker.js; do
            if [ ! -f "dist/$file" ]; then
              echo "missing from the bundle: $file"
              exit 1
            fi
          done
          echo "bundle complete"

  layout:
    name: Repository layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tree matches its manifests
        run: node .github/verify-layout.mjs
