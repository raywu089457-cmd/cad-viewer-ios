name: checks

# What runs here, and one thing that cannot.
#
# This account has no macOS runner capacity: billing shows Linux minutes only, and every
# macOS job so far was cancelled within a second without a runner being assigned. So the one
# check that needs an Apple SDK — building the app — cannot run in CI at all, and pretending
# otherwise with a job that is always cancelled would be worse than saying so.
#
# What is left is everything that genuinely runs:
#
# - `layout` verifies the tree against its manifests, which is what catches a target with no
#   directory, an orphan directory SwiftPM would refuse, a product a package does not
#   export, and the generated resource folder going missing.
# - `web-viewer` builds the DWG bundle, the half of the project with no Apple dependency,
#   and checks the four files the app fetches at runtime are in the output.
#
# The Swift checks run where a Swift toolchain that can build SwiftDXF exists:
#
#     cd ios/DXFGeometry && swift test                 # 4 suites
#     cd verification/dxf-geometry-harness && ./run.sh verify   # 134 checks
#     cd ios && xcodegen generate && xcodebuild ...    # the app layer, macOS only
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  layout:
    name: Repository layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tree matches its manifests
        run: node .github/verify-layout.mjs

      # Which scripts are checks, which are records, and whether the README agrees. Eleven
      # historical scripts used to sit beside the checks, all exiting non-zero.
      - name: Checks match their inventory
        run: node verification/check-inventory.mjs

      # Seconds, not minutes: the stub declarations are plain text, and each duplicate or missing
      # name it finds used to cost a nine-minute round in the Swift job.
      - name: Stub declarations
        run: node verification/check-stubs.mjs

      # No PDF was ever a fixture: the verdict was checked with made-up page counts and nothing
      # established that a real file reaches them.
      - name: PDF fixtures match their verdicts
        run: node verification/check-pdf-fixtures.mjs

  web-viewer:
    name: DWG bundle builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        working-directory: ios/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # An extension the handler does not know is served as octet-stream, which WebKit
      # downloads instead of rendering. Nothing compared the table with the bundle before.
      - name: Every bundle extension has a MIME type
        run: node verification/check-mime-coverage.mjs --require-bundle

      # The app fetches these four by URL at runtime, so a bundle missing one produces a
      # blank DWG tab rather than a build error.
      - name: Check the bundle has what the app fetches
        working-directory: ios/web
        run: |
          for file in index.html \
                      assets/libredwg-parser-worker.js \
                      assets/libredwg-web.wasm \
                      assets/mtext-renderer-worker.js \
                      assets/LICENSE-LibreDWG.txt \
                      assets/LICENSE-cad-simple-viewer.txt; do
            if [ ! -f "dist/$file" ]; then
              echo "missing from the bundle: $file"
              exit 1
            fi
          done
          echo "bundle complete"

  dwg-reopen:
    name: DWG reopens on a loaded page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The test drives a real browser through both loads. It exists because the reopen path
      # silently did nothing for a while: the page never defined the entry point, and the
      # only symptom was that a second DWG did not appear.
      - name: Install Playwright
        working-directory: verification
        run: |
          # `npm ci` rather than `npm install`: it installs exactly the lockfile and fails if
          # the two have drifted, which is the only way this job is reproducible.
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build the viewer
        working-directory: ios/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Every DWG format the samples cover, because the engine handles them differently and a
      # format nothing opens is a format nothing checks. R2000 was in the tree and untested.
      - name: Reopen every sample drawing
        run: |
          node verification/test-dwg-reopen.mjs \
            "$PWD/ios/web/dist" \
            "$PWD/samples/example_2018.dwg" \
            "$PWD/samples/example_2013.dwg" \
            "$PWD/samples/example_2000.dwg"

  api-usage:
    name: App calls match the geometry API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The app layer cannot be type-checked without an Apple SDK, but most of what it calls
      # is DXFGeometry, which compiles here. This checks the argument labels of those calls
      # against the declarations: the mistake `swiftc -parse` misses and that would
      # otherwise only surface on a Mac.
      - name: Check argument labels
        run: node verification/check-api-usage.mjs

      - name: Check the UI does not read files on the main thread
        run: node verification/check-main-thread-io.mjs

      - name: Check for retain cycles that would leak a web view
        run: node verification/check-retain-cycles.mjs

      - name: Check UI state is main-actor isolated
        run: node verification/check-actor-isolation.mjs

  syntax:
    name: App layer parses
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4

      # Syntax only, and only for the parts that do not need an Apple SDK to parse. This is
      # a weak check: it catches a stray brace or a broken multi-line string, not a type
      # error. It exists because those were real failures in this repository's app layer and
      # nothing else here would find them on Linux.
      - name: Parse the Swift sources
        run: |
          set +e
          ./verification/parse-check.sh
          status=$?
          # 77 means no toolchain was available: nothing was checked, which is not a pass.
          if [ "$status" -eq 77 ]; then
            echo "::warning::no Swift toolchain; syntax was not checked"
            exit 0
          fi
          exit "$status"

  coordinates:
    name: Geometry matches the file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This checks the committed snapshot rather than the pipeline: both files are fixed,
      # so it proves the JSON has not been edited by hand, not that the pipeline is correct.
      # The pipeline is checked by the harness, which needs a Swift toolchain and cannot run
      # on this runner.
      #
      # Worth keeping anyway: a snapshot that quietly stops matching is how the independent
      # check becomes decoration.
      - name: Cross-check a drawing with circles and lines
        run: |
          node $GITHUB_WORKSPACE/verification/verify-coordinates.mjs \
            $GITHUB_WORKSPACE/verification/fixtures/circles.dxf \
            $GITHUB_WORKSPACE/verification/fixtures/circles.json
  swift-tests:
    name: Geometry tests and harness
    runs-on: ubuntu-latest
    # Swift 6: the suites use Swift Testing, which the 5.10 image does not carry.
    container: swift:6.4-bookworm
    steps:
      - uses: actions/checkout@v4

      # SwiftDXF guards its CoreFoundation code-page decoding with `canImport(CoreFoundation)`,
      # which succeeds on Linux while the CFString symbols do not exist. The checkout is
      # patched to narrow that guard, the same way the wasm harness does it, so the test
      # suites can run here rather than only on a Mac nobody has.
      - name: Resolve dependencies
        working-directory: ios/DXFGeometry
        run: swift package resolve

      - name: Patch the dependency for Linux
        run: ./verification/patch-swiftdxf-for-linux.sh

      - name: Test DXFGeometry
        working-directory: ios/DXFGeometry
        run: swift test

      - name: Resolve the harness
        working-directory: verification/dxf-geometry-harness
        run: swift package resolve

      # The harness has its own checkout of the same dependency, resolved at a different time.
      - name: Patch the harness dependency too
        run: ./verification/patch-swiftdxf-for-linux.sh

      # The app layer cannot be compiled here, but it can be type-checked against the stubs in
      # verification/stubs now that DXFGeometry has been built. This toolchain ships the
      # Observation macro plugin, which the local wasm target does not, so `@Observable`
      # resolves. Blocking, because a step that reports errors while showing green is the thing
      # this project keeps having to remove.
      - name: Type-check the app layer
        shell: bash
        run: ./verification/check-types.sh
      - name: Build the harness
        working-directory: verification/dxf-geometry-harness
        run: swift build -c release

      - name: Run the harness
        working-directory: verification/dxf-geometry-harness
        run: swift run -c release verify

      - name: Check the committed snapshot is current
        working-directory: verification/dxf-geometry-harness
        run: |
          binary="$(swift build -c release --show-bin-path)/scenecheck"
          # The comparison lives in the tool, because this image carries neither node nor
          # python: both were tried and both were missing. It walks the polylines and compares
          # points to a millionth, which is what the check was always about.
          "$binary" --verify-fresh ../fixtures/circles.json < ../fixtures/circles.dxf

