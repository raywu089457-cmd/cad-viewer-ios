# XcodeGen spec: `xcodegen generate` produces CADViewer.xcodeproj.
#
# The Swift packages hold the code and their own tests; this file only exists to give them
# an app target, a bundle id and the Info.plist keys that opening files needs.
name: CADViewer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # The DWG viewer ships a 10 MB wasm engine and the geometry is double precision; both
    # are fine, but keep bitcode off and let Xcode strip what it can.
    ENABLE_BITCODE: NO
    SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  CADViewer:
    path: CADViewer
  DXFGeometry:
    path: DXFGeometry

targets:
  CADViewer:
    type: application
    platform: iOS
    sources:
      - path: CADViewer/Sources/CADViewerApp
    dependencies:
      - package: CADViewer
        product: CADViewer
    # The Info.plist is hand-written and is the single source of truth for the
    # document types, so XcodeGen must not generate one. Setting INFOPLIST_FILE
    # below points the target at it; generating here would overwrite it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cadviewer
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # SwiftUI previews and the app both come from the package.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CADViewer/Info.plist
